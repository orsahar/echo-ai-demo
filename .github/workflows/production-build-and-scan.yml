name: production - build & scan

on:
  push:
    branches: [main]
    paths:
      - "packages/production/app/**"
      - ".github/workflows/production-build-and-scan.yml"
  pull_request:
    paths:
      - "packages/production/app/**"
      - ".github/workflows/production-build-and-scan.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-scan:
    name: build & scan (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: regular
            dockerfile: Dockerfile
            image_name: production-regular
          - variant: echo
            dockerfile: Dockerfile.echo
            image_name: production-echo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Echo secrets are set
        if: matrix.variant == 'echo'
        run: |
          missing=""
          [ -z "${{ secrets.ECHO_REGISTRY_USERNAME }}" ] && missing="$missing ECHO_REGISTRY_USERNAME"
          [ -z "${{ secrets.ECHO_REGISTRY_TOKEN }}" ] && missing="$missing ECHO_REGISTRY_TOKEN"
          [ -z "${{ secrets.ECHO_LIBRARIES_KEY }}" ] && missing="$missing ECHO_LIBRARIES_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s) for packages/production/app/Dockerfile.echo:$missing (see root README)"
            exit 1
          fi

      - name: Log in to Echo registry
        if: matrix.variant == 'echo'
        uses: docker/login-action@v3
        with:
          registry: reg.echohq.com
          username: ${{ secrets.ECHO_REGISTRY_USERNAME }}
          password: ${{ secrets.ECHO_REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        if: matrix.variant == 'echo'
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.variant }} image
        env:
          ECHO_LIBRARIES_KEY: ${{ secrets.ECHO_LIBRARIES_KEY }}
        run: |
          if [ "${{ matrix.variant }}" = "echo" ]; then
            docker buildx build \
              --secret id=NPM_AUTH_TOKEN,env=ECHO_LIBRARIES_KEY \
              --load \
              -f packages/production/app/${{ matrix.dockerfile }} \
              -t ${{ matrix.image_name }}:${{ github.sha }} \
              packages/production/app
          else
            docker build \
              -f packages/production/app/${{ matrix.dockerfile }} \
              -t ${{ matrix.image_name }}:${{ github.sha }} \
              packages/production/app
          fi

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.2.6

      - name: Download Echo OpenVEX feed
        if: matrix.variant == 'echo'
        run: curl -fsSL https://advisory.echohq.com/openvex.json -o openvex.json

      - name: Scan image with Trivy (table)
        run: |
          VEX_ARGS=""
          if [ "${{ matrix.variant }}" = "echo" ]; then
            VEX_ARGS="--vex openvex.json"
          fi
          trivy image --scanners vuln --ignore-unfixed --exit-code 0 \
            $VEX_ARGS --format table \
            ${{ matrix.image_name }}:${{ github.sha }}

      - name: Scan image with Trivy (json)
        run: |
          VEX_ARGS=""
          if [ "${{ matrix.variant }}" = "echo" ]; then
            VEX_ARGS="--vex openvex.json"
          fi
          trivy image --scanners vuln --ignore-unfixed --exit-code 0 \
            $VEX_ARGS --format json \
            --output trivy-results-${{ matrix.variant }}.json \
            ${{ matrix.image_name }}:${{ github.sha }}

      - name: Show Echo-remediated vulnerabilities (suppressed by VEX)
        if: matrix.variant == 'echo'
        run: |
          trivy image --scanners vuln --ignore-unfixed --exit-code 0 \
            --vex openvex.json --show-suppressed --format table \
            ${{ matrix.image_name }}:${{ github.sha }} > full-table.txt 2>/dev/null || true
          {
            echo "### Echo-remediated vulnerabilities (suppressed via OpenVEX)"
            echo
            if grep -q "Suppressed Vulnerabilities" full-table.txt; then
              echo '```'
              tail -n +"$(grep -n "Suppressed Vulnerabilities" full-table.txt | head -1 | cut -d: -f1)" full-table.txt
              echo '```'
            else
              echo "_None suppressed for this build._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize scan results
        if: always()
        run: |
          {
            echo "### Trivy scan - ${{ matrix.variant }} image (\`${{ matrix.dockerfile }}\`)"
            echo
            counts=$(jq -r '
              [.Results[]?.Vulnerabilities[]?] as $vulns
              | ($vulns | length) as $total
              | ($vulns | group_by(.Severity) | map({(.[0].Severity): length}) | add // {}) as $by_sev
              | "| Severity | Count |\n|---|---|\n"
                + (["CRITICAL","HIGH","MEDIUM","LOW","UNKNOWN"]
                    | map("| \(.) | \($by_sev[.] // 0) |")
                    | join("\n"))
                + "\n| **Total** | **\($total)** |"
            ' trivy-results-${{ matrix.variant }}.json)
            echo "$counts"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-${{ matrix.variant }}
          path: trivy-results-${{ matrix.variant }}.json
          retention-days: 14

  compare:
    name: compare results
    needs: build-and-scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all Trivy results
        uses: actions/download-artifact@v4
        with:
          pattern: trivy-results-*
          path: results
          merge-multiple: true

      - name: Build comparison summary
        run: |
          {
            echo "## Echo demo: regular vs. Echo-hardened production app image"
            echo
            echo "| Severity | regular (\`Dockerfile\`) | echo (\`Dockerfile.echo\`) |"
            echo "|---|---|---|"
            for sev in CRITICAL HIGH MEDIUM LOW UNKNOWN; do
              regular=$(jq -r "[.Results[]?.Vulnerabilities[]? | select(.Severity==\"$sev\")] | length" results/trivy-results-regular.json 2>/dev/null || echo 0)
              echo_count=$(jq -r "[.Results[]?.Vulnerabilities[]? | select(.Severity==\"$sev\")] | length" results/trivy-results-echo.json 2>/dev/null || echo 0)
              echo "| $sev | $regular | $echo_count |"
            done
            regular_total=$(jq -r '[.Results[]?.Vulnerabilities[]?] | length' results/trivy-results-regular.json 2>/dev/null || echo 0)
            echo_total=$(jq -r '[.Results[]?.Vulnerabilities[]?] | length' results/trivy-results-echo.json 2>/dev/null || echo 0)
            echo "| **Total** | **$regular_total** | **$echo_total** |"
          } >> "$GITHUB_STEP_SUMMARY"
